{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="container form-wrap">

    <div class="panel">

        <h1>
            Create account
        </h1>

        <div
            id="message"
            class="hidden"
        ></div>


        <form
            onsubmit="register(event)"
        >

            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    id="name"
                    class="input"
                    required
                    minlength="2"
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    class="input"
                    type="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    class="input"
                    type="password"
                    minlength="6"
                    required
                >

            </div>


            <button
                class="btn"
                type="submit"
            >
                Register
            </button>

        </form>


        <p>

            Already registered?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
