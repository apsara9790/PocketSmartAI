<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

    <!-- ================================
         NAVIGATION BAR
    ================================= -->

    {% if request.url.path not in ["/login", "/register"] %}

    <header>

        <nav class="navbar">

            <div class="nav-container">

                <a
                    href="/"
                    class="brand"
                >
                    PocketSmart AI
                </a>


                <div class="nav-links">

                    <a href="/">
                        Home
                    </a>

                    <a href="/party-planner">
                        Party
                    </a>

                    <a href="/jewelry-planner">
                        Jewelry
                    </a>

                    <a href="/history">
                        History
                    </a>

                    <a href="/dashboard">
                        Dashboard
                    </a>

                    <a href="/login">
                        Login
                    </a>

                    <a
                        href="#"
                        onclick="logoutUser(); return false;"
                    >
                        Logout
                    </a>

                </div>

            </div>

        </nav>

    </header>

    {% endif %}


    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="/static/js/app.js?v=2"></script>


    <script>

        async function logoutUser() {

            try {

                const response =
                    await fetch(
                        "/api/auth/logout",
                        {
                            method: "POST",
                            credentials: "include"
                        }
                    );


                if (response.ok) {

                    window.location.href =
                        "/login";

                } else {

                    alert(
                        "Logout failed"
                    );

                }

            } catch (error) {

                console.error(
                    "Logout Error:",
                    error
                );

                alert(
                    "Something went wrong during logout."
                );

            }

        }

    </script>


</body>

</html>
