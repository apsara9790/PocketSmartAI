{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="container form-wrap">

    <div class="panel">

        <h1>
            Login
        </h1>

        <div
            id="message"
            class="hidden"
        ></div>


        <form
            onsubmit="login(event)"
        >

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    class="input"
                    type="email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    class="input"
                    type="password"
                    required
                >

            </div>


            <button
                class="btn"
                type="submit"
            >
                Login
            </button>

        </form>


        <p>

            New user?

            <a href="/register">
                Create an account
            </a>

        </p>

    </div>

</div>

{% endblock %}
