{% extends "base.html" %}

{% block title %}
History
{% endblock %}

{% block content %}

<div class="container" style="padding:50px 0">

    <h1>Recommendation History</h1>

    <p class="muted">
        Your saved Home, Party and Jewelry plans.
    </p>

    <div id="history-list">
        Loading...
    </div>

</div>


<script>

async function loadHistory() {

    const historyList =
        document.getElementById("history-list");

    try {

        const response =
            await fetch("/api/history");

        if (!response.ok) {

            throw new Error(
                "Failed to load history"
            );

        }

        const history =
            await response.json();


        if (history.length === 0) {

            historyList.innerHTML = `
                <div class="card">
                    <h3>No saved plans yet</h3>

                    <p class="muted">
                        Generate a Home, Party or
                        Jewelry recommendation first.
                    </p>
                </div>
            `;

            return;
        }


        historyList.innerHTML =
            history.map(item => {

                const planner =
                    item.planner_type
                        .charAt(0)
                        .toUpperCase()
                    +
                    item.planner_type.slice(1);


                const request =
                    item.request || {};


                const response =
                    item.response || {};


                return `

                    <div class="card"
                         style="
                            margin-top:20px;
                            padding:25px;
                         ">

                        <h2>
                            ${planner} Planner
                        </h2>

                        <p class="muted">
                            Saved on:
                            ${item.created_at}
                        </p>


                        <hr>


                        <h3>
                            Your Plan
                        </h3>


                        <p>
                            <strong>Budget:</strong>
                            ₹${request.budget ?? "-"}
                        </p>


                        ${
                            request.room_type
                            ? `
                                <p>
                                    <strong>
                                        Room:
                                    </strong>
                                    ${request.room_type}
                                </p>
                              `
                            : ""
                        }


                        ${
                            request.style
                            ? `
                                <p>
                                    <strong>
                                        Style:
                                    </strong>
                                    ${request.style}
                                </p>
                              `
                            : ""
                        }


                        ${
                            request.occasion
                            ? `
                                <p>
                                    <strong>
                                        Occasion:
                                    </strong>
                                    ${request.occasion}
                                </p>
                              `
                            : ""
                        }


                        ${
                            request.guest_count
                            ? `
                                <p>
                                    <strong>
                                        Guests:
                                    </strong>
                                    ${request.guest_count}
                                </p>
                              `
                            : ""
                        }


                        <br>


                        <button
                            onclick="
                                viewRecommendation(
                                    ${item.id}
                                )
                            "
                        >
                            View Recommendation
                        </button>


                        <button
                            onclick="
                                deleteRecommendation(
                                    ${item.id}
                                )
                            "
                            style="margin-left:10px"
                        >
                            Delete
                        </button>

                    </div>

                `;

            }).join("");


    } catch (error) {

        console.error(error);

        historyList.innerHTML = `
            <div class="card">

                <h3>
                    Unable to load history
                </h3>

                <p>
                    Please login again and try.
                </p>

            </div>
        `;

    }
}



async function viewRecommendation(id) {

    try {

        const response =
            await fetch(
                `/api/history/${id}`
            );


        if (!response.ok) {

            throw new Error(
                "Recommendation not found"
            );

        }


        const data =
            await response.json();


        const recommendation =
            data.response || {};


        alert(
            JSON.stringify(
                recommendation,
                null,
                2
            )
        );


    } catch (error) {

        alert(
            "Unable to load recommendation."
        );

    }
}



async function deleteRecommendation(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this saved plan?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/history/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }


        loadHistory();


    } catch (error) {

        alert(
            "Unable to delete the plan."
        );

    }

}


loadHistory();

</script>

{% endblock %}
